<style>
/* Layout: mobile-first app shell, sticky header, bottom tab bar on phone, side-by-side tabs on desktop */
:root{
  --bg:#f7f6f1; --surface:#ffffff; --surface2:#f0eee4; --line:#e2ddcb;
  --fg:#23241c; --muted:#6c6b5c; --accent:#b8860b; --accent-ink:#1f1a05; --accent-soft:#f6e9bf;
  --wa:#1f9d55; --wa-ink:#ffffff; --due:#c0392b; --ok:#1f8a4c;
  --display:"Baloo 2","Mukta",system-ui,sans-serif; --body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16170f; --surface:#1f2016; --surface2:#28291d; --line:#3a3a2a;
  --fg:#efeee2; --muted:#a8a690; --accent:#e0b23a; --accent-ink:#1a1402; --accent-soft:#3b3214;
  --wa:#2bb56a; --wa-ink:#06140b; --due:#f07a6c; --ok:#5ccc8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16170f; --surface:#1f2016; --surface2:#28291d; --line:#3a3a2a;
  --fg:#efeee2; --muted:#a8a690; --accent:#e0b23a; --accent-ink:#1a1402; --accent-soft:#3b3214;
  --wa:#2bb56a; --wa-ink:#06140b; --due:#f07a6c; --ok:#5ccc8a; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body.ro #addC, body.ro [data-edit], body.ro [data-bill], body.ro #mpaid, body.ro #addPur, body.ro [data-pe], body.ro #medit, body.ro #mdel{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:980px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:36px;height:36px;border-radius:50% 50% 50% 8px;background:var(--accent);transform:rotate(-45deg);flex:none}

nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--muted);font:600 .95rem var(--body);padding:10px 6px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs .ic{display:block;font-size:1.15rem;line-height:1}
@media (max-width:700px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
    padding:2px max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px))}
  nav.tabs button{font-size:.7rem;padding:8px 1px;border-bottom:0;border-top:3px solid transparent}

}
@media (min-width:701px){ nav.tabs .ic{display:none} .desk-tabs{border-bottom:1px solid var(--line);background:var(--surface)} }
main .wrap{padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-size:1.45rem;margin:0;text-wrap:balance;line-height:1.2}
h3{font-family:var(--display);font-size:1.1rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 140px;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;font-size:1rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:600 1rem var(--body);border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink)}
.btn.small{font-size:.85rem;padding:5px 10px}
.btn.ghost{background:none}
.btn.danger{color:var(--due)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.due{color:var(--due);font-weight:600}
.ok{color:var(--ok);font-weight:600}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.due{background:color-mix(in srgb,var(--due) 15%,transparent);color:var(--due)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
td.r,th.r{text-align:right}
.items .line{display:grid;grid-template-columns:2fr 80px 100px 100px 36px;gap:8px;align-items:end}
@media (max-width:600px){.items .line{grid-template-columns:1fr 1fr 1fr;}.items .line .pname{grid-column:1/-1}.items .line .lamt{grid-column:1/3}}
.lamt{font-weight:600;padding:9px 0;text-align:right}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:1rem}
.totals .grand{font-family:var(--display);font-size:1.4rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{font-size:.82rem;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:1.4rem;font-weight:700;line-height:1.2}
.stat .s{font-size:.78rem;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;border-bottom:1px solid var(--line);padding-top:8px}
.bars div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;opacity:.85}
.bars div.today{opacity:1;outline:2px solid var(--fg);outline-offset:-2px}
.barlbl{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li .main{flex:1 1 180px;min-width:0}
.li .main b{display:block}
.li .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.notice{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.92rem}
.receipt{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:.92rem;font-family:var(--body)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:701px){.modal{align-items:center}}
.modal .card{width:100%;max-width:560px;max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:30;font-weight:600}
.check{display:flex;flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:1rem}
.check input{width:auto}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.segs .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header class="top">
  <div class="wrap">
    <div class="logo" aria-hidden="true"></div>
    <div class="brand"><span id="shopName">Divine Elite Oil</span><small>बिलिंग · ग्राहक · व्हाट्सएप</small></div>
    <div class="sync" id="sync">लोड हो रहा है…</div>
  </div>
  <div class="desk-tabs"><div class="wrap"><nav class="tabs" id="tabs"></nav></div></div>
</header>

<main><div class="wrap" id="view"></div></main>
<div id="modalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module" src="firebase.js"></script>
<script>
(function(){
"use strict";
// ---------- helpers ----------
const $ = (s,el=document)=>el.querySelector(s);
const esc = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr = n => "₹" + (Math.round((+n||0)*100)/100).toLocaleString("en-IN",{maximumFractionDigits:2});
const r2 = n => Math.round((+n||0)*100)/100;
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ymd(new Date());
const showDate = s => s ? s.split("-").reverse().join("-") : "";
const MONTHS = ["जनवरी","फरवरी","मार्च","अप्रैल","मई","जून","जुलाई","अगस्त","सितंबर","अक्टूबर","नवंबर","दिसंबर"];
const monthName = ym => { const [y,m]=ym.split("-"); return MONTHS[+m-1]+" "+y; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const phoneWa = p => { let d=String(p||"").replace(/\D/g,""); if(d.length===11&&d[0]==="0") d=d.slice(1); if(d.length===10) d="91"+d; return d; };
const waLink = (phone,text) => { const n=phoneWa(phone); return "https://wa.me/"+(n||"")+"?text="+encodeURIComponent(text); };

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

// ---------- data layer (db when available, otherwise this browser) ----------
const COLLS = ["customers","products","bills","purchases","settings"];
const state = { customers:[], products:[], bills:[], purchases:[], users:[], settings:{}, mode:"loading" };
let db = null;
const LS = "divine-oil-v1";
function lsLoad(){ try{ const j=JSON.parse(localStorage.getItem(LS)||"{}"); COLLS.forEach(c=>{ if(c==="settings") state.settings=j.settings||{}; else state[c]=j[c]||[]; }); }catch(e){} }
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify({customers:state.customers,products:state.products,bills:state.bills,purchases:state.purchases,settings:state.settings})); }catch(e){} }

async function save(coll,id,data){
  if(coll==="settings"){ state.settings={...state.settings,...data}; }
  else { const arr=state[coll]; const i=arr.findIndex(x=>x.id===id); const rec={...data,id}; if(i>=0) arr[i]=rec; else arr.push(rec); }
  if(db){ try{ if(coll==="settings") await db.doc("settings/shop").set({...state.settings}); else { const {id:_,...rest}=data; await db.collection(coll).doc(id).set(rest); } }catch(e){ toast("सेव नहीं हुआ: "+(e&&e.message||"")); } }
  else lsSave();
  render();
}
async function removeRec(coll,id){
  state[coll]=state[coll].filter(x=>x.id!==id);
  if(db){ try{ await db.collection(coll).doc(id).delete(); }catch(e){ toast("हटाया नहीं जा सका"); } } else lsSave();
  render();
}

function setSync(){
  const el=$("#sync");
  el.textContent = state.mode==="loading"?"लोड हो रहा है…":"";
}

function waitFB(){ return window.FB?Promise.resolve(window.FB):new Promise(r=>window.addEventListener("fb-ready",()=>r(window.FB),{once:true})); }
let FBX=null, unsubs=[], subscribed=false;
function unsubAll(){ unsubs.forEach(u=>{ try{u();}catch(_){} }); unsubs=[]; subscribed=false; }
function subscribeData(){
  subscribed=true; const pending=new Set(["customers","products","bills","purchases","settings","users"]);
  const done=c=>{ if(pending.delete(c)&&!pending.size){ state.mode="db"; } render(); };
  const fail=e=>{ toast("डेटा नहीं खुला: "+(e&&e.code||"")); };
  ["customers","products","bills","purchases","users"].forEach(c=>{ unsubs.push(FBX.onColl(c,docs=>{ state[c]=docs; done(c); },fail)); });
  unsubs.push(FBX.onDoc("settings/shop",d=>{ state.settings=d||{}; done("settings"); },fail));
}
async function connect(){
  const F=FBX=await waitFB();
  db={ collection:c=>({ doc:id=>({ set:d=>F.set(c+"/"+id,d), delete:()=>F.del(c+"/"+id) }) }), doc:p=>({ set:d=>F.set(p,d) }) };
  F.onAuth(async u=>{
    unsubAll(); me=null; state.users=[];
    if(!u){ let owner=null; try{ owner=await F.get("meta/owner"); }catch(_){} state.mode=owner?"login":"setup"; render(); return; }
    state.mode="loading"; render();
    unsubs.push(F.onDoc("users/"+u.uid,d=>{
      if(!d){ me=null; state.mode="noaccess"; render(); return; }
      me={uid:u.uid,...d}; if(!subscribed) subscribeData(); else render();
    },()=>{ state.mode="noaccess"; render(); }));
  });
}
window.addEventListener("online",()=>render()); window.addEventListener("offline",()=>render());

// ---------- calculations ----------
const S = () => ({ name:"Divine Elite Oil", address:"", phone:"", gstin:"", gstOn:false, gstIncl:true, prefix:"DEO-", footer:"धन्यवाद! फिर पधारें 🙏", adminPin:"", staff:[], ...state.settings });
function calcBill(items, discount, gstOn, gstIncl){
  // discount is spread over the lines before tax, so taxable value is after discount
  const gross=items.reduce((a,it)=>a+r2((+it.qty||0)*(+it.rate||0)),0);
  const f=gross>0?Math.max(0,(gross-(+discount||0))/gross):1;
  let sub=0, tax=0;
  const lines=items.map(it=>{
    const net=r2((+it.qty||0)*(+it.rate||0))*f; const g=gstOn?(+it.gst||0):0; let base=net, t=0;
    if(g){ if(gstIncl){ base=net/(1+g/100); t=net-base; } else { t=net*g/100; } }
    sub+=base; tax+=t; return {base,tax:t,g};
  });
  return { sub:r2(sub), tax:r2(tax), total:r2(sub+tax), lines };
}
function inWords(num){
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const t=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=n=>n<20?a[n]:t[Math.floor(n/10)]+(n%10?" "+a[n%10]:"");
  const three=n=>(n>=100?a[Math.floor(n/100)]+" Hundred"+(n%100?" ":""):"")+(n%100?two(n%100):"");
  let n=Math.floor(num), paise=Math.round((num-n)*100), out=[];
  const cr=Math.floor(n/1e7); n%=1e7; const lk=Math.floor(n/1e5); n%=1e5; const th=Math.floor(n/1e3); n%=1e3;
  if(cr) out.push(two(cr)+" Crore"); if(lk) out.push(two(lk)+" Lakh"); if(th) out.push(two(th)+" Thousand"); if(n) out.push(three(n));
  let w="Rupees "+(out.join(" ")||"Zero"); if(paise) w+=" and "+two(paise)+" Paise"; return w+" Only";
}
const billDue = b => r2((b.total||0)-(b.paid||0));
function custStats(cid){ const bs=state.bills.filter(b=>b.customerId===cid); return { count:bs.length, total:r2(bs.reduce((a,b)=>a+(b.total||0),0)), due:r2(bs.reduce((a,b)=>a+Math.max(0,billDue(b)),0)), last:bs.map(b=>b.date).sort().pop()||"" }; }
function nextBillNo(){ const s=S(); let max=0; state.bills.forEach(b=>{ const m=String(b.no||"").match(/(\d+)\s*$/); if(m) max=Math.max(max,+m[1]); }); return s.prefix+String(max+1).padStart(4,"0"); }

function billText(b){
  const s=S(); const L=[];
  if(b.gstOn) L.push("*TAX INVOICE / टैक्स इनवॉइस*");
  L.push("*"+s.name+"*"); L.push("शुद्ध · प्राकृतिक · बिना रिफाइन · कोल्ड प्रेस"); if(s.address) L.push(s.address); if(s.phone) L.push("फ़ोन: "+s.phone); if(b.gstOn&&s.gstin) L.push("GSTIN: "+s.gstin);
  L.push(""); L.push("बिल नं: "+b.no+"   तारीख: "+showDate(b.date)); L.push("ग्राहक: "+(b.customerName||"नकद ग्राहक")); if(b.gstOn&&b.customerGstin) L.push("ग्राहक GSTIN: "+b.customerGstin);
  L.push("------------------------------");
  (b.items||[]).forEach(it=>L.push(it.name+(b.gstOn&&it.hsn?" (HSN "+it.hsn+", GST "+it.gst+"%)":"")+"  "+it.qty+" "+(it.unit||"")+" × "+inr(it.rate)+" = "+inr(r2(it.qty*it.rate))));
  L.push("------------------------------");
  if(b.discount) L.push("छूट: -"+inr(b.discount));
  if(b.gstOn&&b.tax){ const cg=r2(b.tax/2); L.push("टैक्स योग्य राशि: "+inr(b.sub)); L.push("CGST: "+inr(cg)+"  SGST: "+inr(r2(b.tax-cg))); if(s.gstIncl) L.push("(रेट में GST शामिल है)"); }
  L.push("*कुल राशि: "+inr(b.total)+"*");
  L.push("जमा: "+inr(b.paid||0)+" ("+(b.mode||"नकद")+")");
  const due=billDue(b); if(due>0) L.push("*बाकी: "+inr(due)+"*");
  L.push(""); L.push(s.footer);
  return L.join("\n");
}

// ---------- UI shell ----------
const TABS=[["bill","नया बिल","🧾"],["bills","बिल","📋"],["report","सेल","📊"],["customers","ग्राहक","👥"],["purchase","खरीद","📥"],["msg","मैसेज","💬"],["settings","सेटिंग","⚙️"]];
const MODES=["नकद","UPI / QR","डेबिट कार्ड","क्रेडिट कार्ड","बैंक ट्रांसफर","उधार"];
const STAFF_TABS=["bill","bills","customers","msg"];
const PARTNER_TABS=["bills","report","customers","purchase"];
const ROLE_NAME={admin:"एडमिन",staff:"स्टाफ़",partner:"पार्टनर"};
let me=null;
const isAdmin=()=>!!me&&me.role==="admin";
const isPartner=()=>!!me&&me.role==="partner";
const isLocked=()=>!me;
const meName=()=>me?me.name:"";
const allowedTabs=()=>TABS.filter(t=>isAdmin()||(isPartner()?PARTNER_TABS:STAFF_TABS).includes(t[0]));
const phoneEmail=ph=>String(ph).replace(/\D/g,"").slice(-10)+"@users.divine-elite-oil.app";
let tab = (location.hash||"").slice(1); if(!TABS.some(t=>t[0]===tab)) tab="bill";
let draft = freshDraft();
let ui = { billQ:"", billFrom:"", billTo:"", custQ:"", repMonth:today().slice(0,7), repYear:today().slice(0,4), msgText:"नमस्ते {नाम} जी,\nDivine Elite Oil की तरफ़ से नया स्टॉक आ गया है। आज ही ऑर्डर करें। 🙏", msgSel:new Set(), msgFilter:"all", sent:new Set() };
function freshDraft(){ return { customerId:"", customerName:"", customerPhone:"", customerGstin:"", date:today(), items:[{name:"",qty:1,unit:"लीटर",rate:0,gst:5}], discount:0, paid:"", mode:"नकद" }; }

function renderTabs(){
  if(isLocked()){ $("#tabs").innerHTML=""; return; }
  $("#tabs").innerHTML = allowedTabs().map(([k,l,i])=>`<button data-tab="${k}" aria-current="${k===tab}"><span class="ic" aria-hidden="true">${i}</span>${l}</button>`).join("");
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b){ tab=b.dataset.tab; try{history.replaceState(null,"","#"+tab);}catch(_){location.hash=tab;} render(); window.scrollTo(0,0);} });
window.addEventListener("hashchange",()=>{ const t=location.hash.slice(1); if(TABS.some(x=>x[0]===t)&&t!==tab){ tab=t; render(); } });

function render(){
  const s=S(); $("#shopName").textContent=s.name; setSync(); renderTabs();
  const v=$("#view");
  const keepFocus=document.activeElement&&document.activeElement.id; const sel=keepFocus&&document.activeElement.selectionStart;
  if(state.mode==="loading"){ v.innerHTML=`<div class="card empty">डेटा लोड हो रहा है…</div>`; return; }
  document.body.classList.toggle("ro",isPartner());

  if(state.mode==="login"){ viewLogin(v); return; }
  if(state.mode==="noaccess"){ v.innerHTML=`<div class="card" style="max-width:440px;margin:24px auto;width:100%"><h2>आपका अकाउंट बंद है</h2><p>एडमिन से अपना अकाउंट फिर से जुड़वाएं।</p><button class="btn" id="lo2">लॉग आउट</button></div>`; $("#lo2").onclick=()=>FBX.signOut(); return; }

  if(me){ const el=$("#sync"); el.innerHTML=`${esc(me.name)} <span class="pill">${esc(ROLE_NAME[me.role]||"")}</span><br><span class="${navigator.onLine?"":"due"}" style="font-size:.75rem">${navigator.onLine?"✓ ऑनलाइन":"ऑफ़लाइन, नेट आने पर सेव होगा"}</span> <button class="btn small ghost" id="logout" style="padding:2px 8px;margin-top:2px">लॉग आउट</button>`; $("#logout").onclick=()=>{ $("#modalRoot").innerHTML=""; FBX.signOut(); }; }

async function saveBill(){
  const s=S(); const items=draft.items.filter(it=>String(it.name).trim()&&(+it.qty>0));
  if(!items.length){ toast("कम से कम एक सामान डालें"); return; }
  let cid=draft.customerId, cname=draft.customerName.trim(), cphone=draft.customerPhone.trim();
  if(!cid && cname){
    const ex=state.customers.find(x=>(cphone&&phoneWa(x.phone)===phoneWa(cphone))||x.name.toLowerCase()===cname.toLowerCase());
    if(ex){ cid=ex.id; cname=ex.name; cphone=ex.phone||cphone; }
    else { cid=uid(); await save("customers",cid,{name:cname,phone:cphone,address:"",note:"",gstin:(draft.customerGstin||"").trim(),createdAt:Date.now()}); }
  }
  // remember new products and latest rates
  for(const it of items){ const p=state.products.find(p=>p.name.toLowerCase()===String(it.name).trim().toLowerCase()); if(!p) await save("products",uid(),{name:String(it.name).trim(),unit:it.unit||"लीटर",rate:+it.rate||0,gst:+it.gst||5}); }
  const c=calcBill(items,draft.discount,s.gstOn,s.gstIncl);
  const paid = draft.paid===""?c.total:r2(+draft.paid||0);
  const editing=!!draft.editId; const id=draft.editId||uid();
  const bill={ no:editing?draft.editNo:nextBillNo(), date:draft.date||today(), customerId:cid||"", customerName:cname||"नकद ग्राहक", customerPhone:cphone||"", customerGstin:(state.customers.find(x=>x.id===cid)||{}).gstin||"",
    items:items.map(it=>{ const pr=state.products.find(p=>p.name===String(it.name).trim())||{}; return {name:String(it.name).trim(),qty:+it.qty,unit:it.unit||"",rate:+it.rate,gst:pr.gst!=null?+pr.gst:(+it.gst||0),hsn:pr.hsn||it.hsn||""}; }),
    discount:+draft.discount||0, sub:c.sub, tax:c.tax, total:c.total, paid, mode:draft.mode, gstOn:!!s.gstOn, createdAt:editing?(draft.editCreatedAt||Date.now()):Date.now(), createdBy:editing?(draft.createdBy||""):meName() };
  if(editing){ bill.editedAt=Date.now(); bill.editedBy=meName(); }
  await save("bills",id,bill);
  draft=freshDraft(); toast(editing?"बिल बदल दिया गया":"बिल सेव हो गया");
  openBill(id);
}

// ---------- Saving and sharing files ----------
function blobToB64(blob){ return new Promise((r,j)=>{ const fr=new FileReader(); fr.onload=()=>r(String(fr.result).split(",")[1]); fr.onerror=j; fr.readAsDataURL(blob); }); }
async function saveFile(name,blob,{share=false,text=""}={}){
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
    const w=await C.Plugins.Filesystem.writeFile({path:name,data:await blobToB64(blob),directory:"CACHE"});
    try{ await C.Plugins.Share.share({title:name,text,files:[w.uri],dialogTitle:"भेजें"}); }catch(_){ }
    return "shared";
  }
  if(share){ const file=new File([blob],name,{type:blob.type||"application/octet-stream"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:name,text}); return "shared"; }catch(e){ if(e&&e.name==="AbortError") return "cancel"; } } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },5000);
  return "downloaded";
}

async function downloadPdf(b,btn){
  if(!window.html2canvas||!window.jspdf){ toast("PDF बनाने वाला हिस्सा लोड नहीं हुआ, पेज दोबारा खोलें"); return; }
  const old=btn.textContent; btn.disabled=true; btn.textContent="PDF बन रहा है…";
  const host=document.createElement("div"); host.style.cssText="position:fixed;left:-10000px;top:0;z-index:-1"; host.innerHTML=invoiceHtml(b); document.body.appendChild(host);
  try{
    try{ await document.fonts.ready; }catch(_){}
    const canvas=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
    const pw=210, ph=297, ih=canvas.height*pw/canvas.width; const img=canvas.toDataURL("image/jpeg",0.92);
    let y=0; pdf.addImage(img,"JPEG",0,0,pw,ih); while(ih+y>ph+1){ y-=ph; pdf.addPage(); pdf.addImage(img,"JPEG",0,y,pw,ih); }
    const blob=pdf.output("blob"); const fname=(b.no+"_"+(b.customerName||"bill")).replace(/[^\w\u0900-\u097F-]+/g,"_")+".pdf";
    host.remove(); btn.disabled=false; btn.textContent="📤 PDF भेजें (WhatsApp)";
    btn.onclick=async()=>{ const r=await saveFile(fname,blob,{share:true,text:"आपका बिल "+b.no+" · "+inr(b.total)+" · "+S().name}); if(r==="downloaded") toast("PDF डाउनलोड हो गया, अब WhatsApp में 📎 से भेजें"); };
    toast("PDF तैयार है, अब “PDF भेजें” दबाएं");
  }catch(e){ host.remove(); btn.disabled=false; btn.textContent=old; toast("PDF नहीं बन पाया"); }
}

async function saveCsv(name,head,rows){
  const cell=v=>{ const t=String(v==null?"":v); return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
  const csv="﻿"+[head,...rows].map(r=>r.map(cell).join(",")).join("\r\n");
  try{ await saveFile(name,new Blob([csv],{type:"text/csv"})); toast("फ़ाइल तैयार है"); }catch(e){ toast("फ़ाइल सेव नहीं हुई"); }
}

async function fileToImages(file){
  if(file.type.startsWith("image/")) return [file];
  if(!window.pdfjsLib) throw new Error("pdf");
  const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; const out=[];
  for(let i=1;i<=Math.min(3,pdf.numPages);i++){
    const page=await pdf.getPage(i); const vp=page.getViewport({scale:1.6}); const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
    await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.85)));
  }
  return out;
}

  $("#mt").oninput=e=>{ ui.msgText=e.target.value; clearTimeout(totT); totT=setTimeout(render,700); };
  v.querySelectorAll("[data-flt]").forEach(b=>b.onclick=()=>{ ui.msgFilter=b.dataset.flt; render(); });
  if($("#selAll")) $("#selAll").onchange=e=>{ list.forEach(c=>e.target.checked?ui.msgSel.add(c.id):ui.msgSel.delete(c.id)); render(); };
  v.querySelectorAll("[data-sel]").forEach(b=>b.onchange=()=>{ b.checked?ui.msgSel.add(b.dataset.sel):ui.msgSel.delete(b.dataset.sel); render(); });
  v.querySelectorAll("[data-send]").forEach(a=>a.addEventListener("click",()=>{ ui.sent.add(a.dataset.send); setTimeout(render,300); }));
}

// ---------- Settings & products ----------
let confirmPDel=null, confirmStaffDel=null;
function viewSettings(v){
  const s=S();
  v.innerHTML=`<h2>सेटिंग</h2>
  <form class="card" id="sf">
    <h3>दुकान की जानकारी (बिल पर छपेगी)</h3>
    <div class="row"><label>दुकान का नाम<input id="s_name" value="${esc(s.name)}"></label><label>फ़ोन<input id="s_phone" inputmode="tel" value="${esc(s.phone)}"></label></div>
    <label>पता<input id="s_addr" value="${esc(s.address)}"></label>
    <div class="row"><label>बिल नंबर की शुरुआत<input id="s_prefix" value="${esc(s.prefix)}"></label><label>बिल के नीचे लाइन<input id="s_footer" value="${esc(s.footer)}"></label></div>
    <label class="check"><input type="checkbox" id="s_gst" ${s.gstOn?"checked":""}> GST बिल बनाना है</label>
    <div class="row" ${s.gstOn?"":"hidden"} id="gstrow"><label>GSTIN<input id="s_gstin" value="${esc(s.gstin)}" placeholder="जैसे: 06ABCDE1234F1Z5"></label>
      <label>रेट में GST<select id="s_incl"><option value="1" ${s.gstIncl?"selected":""}>शामिल है (MRP वाला रेट)</option><option value="0" ${s.gstIncl?"":"selected"}>ऊपर से जुड़ेगा</option></select></label></div>
    <div><button class="btn primary" type="submit">सेव करें</button></div>
  </form>
  <section class="card">
    <h3>पूरा बैकअप</h3>
    <p class="muted" style="margin:0;font-size:.9rem">सारे ग्राहक, बिल, खरीद, प्रोडक्ट और सेटिंग एक फ़ाइल में। इसे हर हफ़्ते या महीने डाउनलोड करके Google Drive या ईमेल में रख लें। अभी कुल ${state.customers.length+state.bills.length+state.purchases.length+state.products.length} एंट्री हैं।</p>
    <div class="row"><button class="btn primary" id="bkDown" type="button">पूरा बैकअप डाउनलोड करें</button>
      <label class="btn" style="flex-direction:row;color:var(--fg);font-size:1rem">बैकअप से वापस लाएं<input type="file" id="bkUp" accept=".json,application/json" hidden></label></div>
    <div id="bkMsg" class="notice" hidden></div>
  </section>
  <section class="card">
    <h3>लोग (स्टाफ़ और पार्टनर)</h3>
    <p class="muted" style="margin:0;font-size:.9rem">हर व्यक्ति अपने मोबाइल नंबर और 6 अंक के PIN से लॉगिन करेगा, अपने फ़ोन पर या दुकान के फ़ोन/PC पर। <b>स्टाफ़</b>: बिल बनाना और भेजना, ग्राहक, मैसेज। <b>पार्टनर</b>: बिल, सेल रिपोर्ट, ग्राहक और खरीद सिर्फ़ देख सकते हैं। <b>एडमिन</b>: सब कुछ।</p>
    <div class="list">${state.users.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(u=>`<div class="li"><div class="main"><b>${esc(u.name)}</b><span class="muted" style="font-size:.85rem">${esc(u.phone||"")} · ${esc(ROLE_NAME[u.role]||u.role)}</span></div>${u.id===me.uid?`<span class="pill ok">आप</span>`:`<button class="btn small ghost danger" data-rmuser="${esc(u.id)}">${confirmStaffDel===u.id?"पक्का हटाएं?":"हटाएं"}</button>`}</div>`).join("")}</div>
    <div class="row"><label>नाम<input id="nu_name" placeholder="जैसे: राजू"></label><label>मोबाइल नंबर<input id="nu_ph" inputmode="tel" placeholder="10 अंक"></label></div>
    <div class="row"><label>PIN (6 अंक)<input id="nu_pin" inputmode="numeric" maxlength="6"></label><label>काम<select id="nu_role"><option value="staff">स्टाफ़</option><option value="partner">पार्टनर</option><option value="admin">एडमिन</option></select></label><button class="btn primary" id="nu_add" type="button" style="flex:0 1 140px">+ जोड़ें</button></div>
  </section>
  <section class="card">
    <div class="row" style="align-items:center"><h3>प्रोडक्ट और रेट</h3><button class="btn" id="addP" style="flex:none">+ प्रोडक्ट</button></div>
    <p class="muted" style="margin:0;font-size:.85rem">यहाँ रेट सेव करेंगे तो बिल बनाते समय प्रोडक्ट चुनते ही रेट अपने आप भर जाएगा।</p>
    <div class="tablebox"><table class="num"><thead><tr><th>प्रोडक्ट</th><th>यूनिट</th><th class="r">रेट</th>${s.gstOn?`<th>HSN</th><th class="r">GST%</th>`:""}<th></th></tr></thead><tbody>
    ${state.products.length?state.products.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.unit)}</td><td class="r">${inr(p.rate)}</td>${s.gstOn?`<td>${esc(p.hsn||"–")}</td><td class="r">${esc(p.gst)}%</td>`:""}<td class="r"><button class="btn small ghost" data-pedit="${esc(p.id)}">बदलें</button></td></tr>`).join(""):`<tr><td colspan="5" class="empty">अभी कोई प्रोडक्ट नहीं</td></tr>`}
    </tbody></table></div>
  </section>
  <p class="muted" style="font-size:.85rem" hidden>${state.mode==="db"?"आपका डेटा ऑनलाइन सेव होता है, फ़ोन और कंप्यूटर दोनों पर यही दिखेगा।":"अभी डेटा सिर्फ़ इसी डिवाइस में सेव हो रहा है। claude.ai में साइन इन करके खोलें तो ऑनलाइन सेव होगा।"}</p>`;
  $("#s_gst").onchange=e=>{ $("#gstrow").hidden=!e.target.checked; };
  $("#sf").onsubmit=async e=>{ e.preventDefault(); await save("settings",null,{name:$("#s_name").value.trim()||"Divine Elite Oil",phone:$("#s_phone").value.trim(),address:$("#s_addr").value.trim(),prefix:$("#s_prefix").value.trim()||"DEO-",footer:$("#s_footer").value.trim(),gstOn:$("#s_gst").checked,gstin:$("#s_gstin").value.trim(),gstIncl:$("#s_incl").value==="1"}); toast("सेटिंग सेव हो गई"); };
  $("#addP").onclick=()=>editProduct(null);
  $("#bkDown").onclick=async()=>{
    const data={app:"divine-elite-oil-billing",version:1,exportedAt:new Date().toISOString(),settings:state.settings,customers:state.customers,products:state.products,bills:state.bills,purchases:state.purchases};
    try{ await saveFile("DivineEliteOil_Backup_"+today()+".json",new Blob([JSON.stringify(data,null,1)],{type:"application/json"})); toast("बैकअप तैयार है"); }
    catch(e){ toast("बैकअप सेव नहीं हुआ"); } };
  $("#bkUp").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; const m=$("#bkMsg"); m.hidden=false;
    let d; try{ d=JSON.parse(await f.text()); }catch(_){ m.textContent="यह बैकअप फ़ाइल सही नहीं है।"; return; }
    if(!d||d.app!=="divine-elite-oil-billing"){ m.textContent="यह इस ऐप की बैकअप फ़ाइल नहीं है।"; return; }
    const cols=["customers","products","bills","purchases"]; const missing=cols.reduce((a,c)=>a+(d[c]||[]).filter(x=>x&&x.id&&!state[c].some(y=>y.id===x.id)).length,0);
    m.innerHTML=`इस फ़ाइल (${esc(String(d.exportedAt||"").slice(0,10))}) में ${missing} एंट्री ऐसी हैं जो अभी ऐप में नहीं हैं। मौजूदा डेटा नहीं बदलेगा, सिर्फ़ ग़ायब एंट्री वापस जुड़ेंगी। <button class="btn small primary" id="bkGo" type="button">${missing} एंट्री वापस लाएं</button>`;
    $("#bkGo").onclick=async()=>{ m.textContent="वापस ला रहे हैं…"; let n=0;
      for(const c of cols) for(const x of (d[c]||[])){ if(x&&x.id&&!state[c].some(y=>y.id===x.id)){ const {id,...rest}=x; await save(c,id,rest); n++; } }
      toast(n+" एंट्री वापस आ गईं"); }; };
  $("#nu_add").onclick=async()=>{ const name=$("#nu_name").value.trim(), ph=$("#nu_ph").value.replace(/\D/g,"").slice(-10), pin=$("#nu_pin").value.trim(), role=$("#nu_role").value;
    if(!name){ toast("नाम डालें"); return; } if(ph.length!==10){ toast("10 अंक का मोबाइल नंबर डालें"); return; } if(!/^\d{6}$/.test(pin)){ toast("PIN 6 अंक का होना चाहिए"); return; }
    const btn=$("#nu_add"); btn.disabled=true; btn.textContent="जोड़ रहे हैं…";
    try{ const nuid=await FBX.createUserOther(phoneEmail(ph),pin); await FBX.set("users/"+nuid,{name,phone:ph,role,createdAt:Date.now()}); toast(name+" जोड़ दिया गया"); }
    catch(x){ toast(x&&x.code==="auth/email-already-in-use"?"यह नंबर पहले से है। उसका पुराना PIN डालें या दूसरा नंबर लें":"नहीं जुड़ा: "+(x&&x.code||x)); btn.disabled=false; btn.textContent="+ जोड़ें"; } };
  v.querySelectorAll("[data-rmuser]").forEach(b=>b.onclick=async()=>{ const id=b.dataset.rmuser; if(confirmStaffDel!==id){ confirmStaffDel=id; render(); return; } confirmStaffDel=null;
    try{ await FBX.del("users/"+id); toast("हटा दिया, अब वो लॉगिन नहीं कर पाएंगे"); }catch(_){ toast("हटाया नहीं जा सका"); } });
}
function editProduct(id){
  const p=id?state.products.find(x=>x.id===id):{name:"",unit:"लीटर",rate:"",gst:5};
  const root=$("#modalRoot");
  root.innerHTML=`<div class="modal" id="mbg"><form class="card" id="pf">
    <h3>${id?"प्रोडक्ट बदलें":"नया प्रोडक्ट"}</h3>
    <label>नाम<input id="p_name" required value="${esc(p.name)}" placeholder="जैसे: सरसों तेल 15 लीटर टिन"></label>
    <div class="row"><label>यूनिट<select id="p_unit">${["लीटर","किलो","टिन","बोतल","पैकेट","पीस"].map(u=>`<option ${u===p.unit?"selected":""}>${u}</option>`).join("")}</select></label>
    <label>रेट (₹)<input type="number" step="any" min="0" id="p_rate" required value="${esc(p.rate)}"></label>
    <label>GST %<select id="p_gst">${[0,5,12,18].map(g=>`<option ${+g===+p.gst?"selected":""}>${g}</option>`).join("")}</select></label>
    <label>HSN कोड<input id="p_hsn" inputmode="numeric" value="${esc(p.hsn||"")}" placeholder="जैसे: 1514"></label></div>
    <div class="row"><button class="btn primary" type="submit">सेव करें</button><button class="btn ghost" type="button" id="px">रद्द करें</button>
    ${id?`<button class="btn ghost danger" type="button" id="pdel">${confirmPDel===id?"पक्का हटाएं?":"हटाएं"}</button>`:""}</div>
  </form></div>`;
  const close=()=>{ root.innerHTML=""; confirmPDel=null; };
  $("#px").onclick=close; $("#mbg").onclick=e=>{ if(e.target.id==="mbg") close(); };
  $("#pf").onsubmit=async e=>{ e.preventDefault(); await save("products",id||uid(),{name:$("#p_name").value.trim(),unit:$("#p_unit").value,rate:+$("#p_rate").value||0,gst:+$("#p_gst").value,hsn:$("#p_hsn").value.trim()}); close(); toast("प्रोडक्ट सेव हो गया"); };
  if($("#pdel")) $("#pdel").onclick=async()=>{ if(confirmPDel!==id){ confirmPDel=id; editProduct(id); return; } close(); await removeRec("products",id); };
}

render();
connect();
})();
</script>
