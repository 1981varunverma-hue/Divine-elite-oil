<style>

.bars{display:flex;align-items:flex-end;gap:3px;height:140px;border-bottom:1px solid var(--line);padding-top:8px}

.list{display:flex;flex-direction:column}

.receipt{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:.92rem;font-family:var(--body)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:701px){.modal{align-items:center}}
.modal .card{width:100%;max-width:560px;max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:30;font-weight:600}
.check{display:flex;flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:1rem}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header class="top">
  <div class="wrap">
    <img class="logo" src="logo.png" alt="Divine Elite Oil">
    <div class="brand"><span id="shopName" hidden>Divine Elite Oil</span><small>बिलिंग · ग्राहक · व्हाट्सएप</small></div>
    <div class="sync" id="sync">लोड हो रहा है…</div>
  </div>
  <div class="desk-tabs"><div class="wrap"><nav class="tabs" id="tabs"></nav></div></div>
</header>

<main><div class="wrap" id="view"></div></main>
<div id="modalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module" src="firebase.js"></script>
<script>
(function(){
"use strict";
// ---------- helpers ----------
const $ = (s,el=document)=>el.querySelector(s);
const esc = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr = n => "₹" + (Math.round((+n||0)*100)/100).toLocaleString("en-IN",{maximumFractionDigits:2});
const r2 = n => Math.round((+n||0)*100)/100;
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ymd(new Date());
const showDate = s => s ? s.split("-").reverse().join("-") : "";
const MONTHS = ["जनवरी","फरवरी","मार्च","अप्रैल","मई","जून","जुलाई","अगस्त","सितंबर","अक्टूबर","नवंबर","दिसंबर"];
const monthName = ym => { const [y,m]=ym.split("-"); return MONTHS[+m-1]+" "+y; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const phoneWa = p => { let d=String(p||"").replace(/\D/g,""); if(d.length===11&&d[0]==="0") d=d.slice(1); if(d.length===10) d="91"+d; return d; };
const waLink = (phone,text) => { const n=phoneWa(phone); return "https://wa.me/"+(n||"")+"?text="+encodeURIComponent(text); };

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

// ---------- data layer (db when available, otherwise this browser) ----------
const COLLS = ["customers","products","bills","purchases","settings"];
const state = { customers:[], products:[], bills:[], purchases:[], users:[], reviews:[], settings:{}, mode:"loading" };
let db = null;
const LS = "divine-oil-v1";
function lsLoad(){ try{ const j=JSON.parse(localStorage.getItem(LS)||"{}"); COLLS.forEach(c=>{ if(c==="settings") state.settings=j.settings||{}; else state[c]=j[c]||[]; }); }catch(e){} }
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify({customers:state.customers,products:state.products,bills:state.bills,purchases:state.purchases,settings:state.settings})); }catch(e){} }

async function save(coll,id,data){
  if(coll==="settings"){ state.settings={...state.settings,...data}; }
  else { const arr=state[coll]; const i=arr.findIndex(x=>x.id===id); const rec={...data,id}; if(i>=0) arr[i]=rec; else arr.push(rec); }
  if(db){ try{ if(coll==="settings") await db.doc("settings/shop").set({...state.settings}); else { const {id:_,...rest}=data; await db.collection(coll).doc(id).set(rest); } }catch(e){ toast("सेव नहीं हुआ: "+(e&&e.message||"")); } }
  else lsSave();
  render();
}
async function removeRec(coll,id){
  state[coll]=state[coll].filter(x=>x.id!==id);
  if(db){ try{ await db.collection(coll).doc(id).delete(); }catch(e){ toast("हटाया नहीं जा सका"); } } else lsSave();
  render();
}

function setSync(){
  const el=$("#sync");
  el.textContent = state.mode==="loading"?"लोड हो रहा है…":"";
}

function waitFB(){ return window.FB?Promise.resolve(window.FB):new Promise(r=>window.addEventListener("fb-ready",()=>r(window.FB),{once:true})); }
let FBX=null, unsubs=[], subscribed=false;
function unsubAll(){ unsubs.forEach(u=>{ try{u();}catch(_){} }); unsubs=[]; subscribed=false; }
function subscribeData(){
  subscribed=true; const pending=new Set(["customers","products","bills","purchases","settings","users"]);
  const done=c=>{ if(pending.delete(c)&&!pending.size){ state.mode="db"; } render(); };
  const fail=e=>{ toast("डेटा नहीं खुला: "+(e&&e.code||"")); };
  ["customers","products","bills","purchases","users"].forEach(c=>{ unsubs.push(FBX.onColl(c,docs=>{ state[c]=docs; done(c); },fail)); });
  unsubs.push(FBX.onDoc("settings/shop",d=>{ state.settings=d||{}; done("settings"); },fail));
  unsubs.push(FBX.onColl("reviews",docs=>{ state.reviews=docs; if(state.mode==="db") render(); },()=>{}));
}
async function connect(){
  const F=FBX=await waitFB();
  db={ collection:c=>({ doc:id=>({ set:d=>F.set(c+"/"+id,d), delete:()=>F.del(c+"/"+id) }) }), doc:p=>({ set:d=>F.set(p,d) }) };
  F.onAuth(async u=>{
    unsubAll(); me=null; state.users=[];
    if(!u){ let owner=null; try{ owner=await F.get("meta/owner"); }catch(_){} state.mode=owner?"login":"setup"; render(); return; }
    state.mode="loading"; render();
    unsubs.push(F.onDoc("users/"+u.uid,d=>{
      if(!d){ me=null; state.mode="noaccess"; render(); return; }
      me={uid:u.uid,...d}; if(!subscribed) subscribeData(); else render();
    },()=>{ state.mode="noaccess"; render(); }));
  });
}
window.addEventListener("online",()=>render()); window.addEventListener("offline",()=>render());

// ---------- calculations ----------
const S = () => ({ name:"Divine Elite Oil", address:"", phone:"", gstin:"", gstOn:false, gstIncl:true, prefix:"DEO-", footer:"धन्यवाद! फिर पधारें 🙏", adminPin:"", staff:[], ...state.settings });
// Oil is priced per litre. A line can be in लीटर, ml, kg or ग्राम; kg converts with the oil's weight (kg per litre).
const OIL_UNITS=["लीटर","ml","kg","ग्राम"];
const KGPL_DEFAULT={"black-mustard":0.91,"yellow-mustard":0.91,"coconut":0.92,"groundnut":0.91,"flaxseed":0.93,"sesame":0.92};
const isOilUnit=u=>OIL_UNITS.includes(u);
const kgpl=it=>(+it.kgPerL>0?+it.kgPerL:0.91);
function toLitres(it){ const q=+it.qty||0; switch(it.unit){ case "ml": return q/1000; case "kg": return q/kgpl(it); case "ग्राम": return q/1000/kgpl(it); default: return q; } }
const lineAmt=it=>r2(toLitres(it)*(+it.rate||0));
const fmtQty=it=>{ const q=+it.qty||0; return (Math.round(q*1000)/1000).toLocaleString("en-IN")+" "+(it.unit||""); };
const prodKgpl=p=>p?(+p.kgPerL>0?+p.kgPerL:(KGPL_DEFAULT[p.id]||0.91)):0.91;
function calcBill(items, discount, gstOn, gstIncl){
  // discount is spread over the lines before tax, so taxable value is after discount
  const gross=items.reduce((a,it)=>a+lineAmt(it),0);
  const f=gross>0?Math.max(0,(gross-(+discount||0))/gross):1;
  let sub=0, tax=0;
  const lines=items.map(it=>{
    const net=lineAmt(it)*f; const g=gstOn?(+it.gst||0):0; let base=net, t=0;
    if(g){ if(gstIncl){ base=net/(1+g/100); t=net-base; } else { t=net*g/100; } }
    sub+=base; tax+=t; return {base,tax:t,g};
  });
  return { sub:r2(sub), tax:r2(tax), total:r2(sub+tax), lines };
}
function inWords(num){
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const t=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=n=>n<20?a[n]:t[Math.floor(n/10)]+(n%10?" "+a[n%10]:"");
  const three=n=>(n>=100?a[Math.floor(n/100)]+" Hundred"+(n%100?" ":""):"")+(n%100?two(n%100):"");
  let n=Math.floor(num), paise=Math.round((num-n)*100), out=[];
  const cr=Math.floor(n/1e7); n%=1e7; const lk=Math.floor(n/1e5); n%=1e5; const th=Math.floor(n/1e3); n%=1e3;
  if(cr) out.push(two(cr)+" Crore"); if(lk) out.push(two(lk)+" Lakh"); if(th) out.push(two(th)+" Thousand"); if(n) out.push(three(n));
  let w="Rupees "+(out.join(" ")||"Zero"); if(paise) w+=" and "+two(paise)+" Paise"; return w+" Only";
}
const billDue = b => r2((b.total||0)-(b.paid||0));
function custStats(cid){ const bs=state.bills.filter(b=>b.customerId===cid); return { count:bs.filter(b=>!isRet(b)).length, total:r2(bs.reduce((a,b)=>a+(b.total||0),0)), due:r2(Math.max(0,bs.reduce((a,b)=>a+(isRet(b)?billDue(b):Math.max(0,billDue(b))),0))), last:bs.map(b=>b.date).sort().pop()||"" }; }
const isRet=b=>b&&b.type==="return";
function nextCnNo(){ let max=0; state.bills.filter(isRet).forEach(b=>{ const m=String(b.no||"").match(/(\d+)\s*$/); if(m) max=Math.max(max,+m[1]); }); return "CN-"+String(max+1).padStart(4,"0"); }
// absolute-value view of a credit note, for printing
const absView=b=>isRet(b)?{...b,sub:Math.abs(b.sub||0),tax:Math.abs(b.tax||0),total:Math.abs(b.total||0),paid:Math.abs(b.paid||0),discount:Math.abs(b.discount||0)}:b;
const REVIEW_URL="https://1981varunverma-hue.github.io/Divine-elite-oil/review.html";
const reviewDiscText=()=>{ const s=S(); return s.revDiscType==="flat"?"₹"+(+s.revDiscValue||50)+" छूट":(+s.revDiscValue||5)+"% छूट"; };
async function checkReviewCode(raw){ const code=String(raw||"").trim().toUpperCase(); if(code.length!==6){ toast("6 अक्षर का कोड डालें"); return null; }
  let r=null; try{ r=await FBX.get("reviews/"+code); }catch(_){ toast("कोड जाँच नहीं पाए, इंटरनेट देखें"); return null; }
  if(!r){ toast("यह कोड नहीं मिला"); return null; } if(r.used){ toast("यह कोड पहले इस्तेमाल हो चुका ("+(r.usedBill||"")+")"); return null; }
  return {code,r}; }
async function markReviewUsed(code,r,billNo,how){ try{ const {id:_x,...rd}=r; await FBX.set("reviews/"+code,{...rd,used:true,usedBill:billNo,usedHow:how,usedAt:Date.now(),usedBy:meName()}); }catch(_){ toast("रिव्यू कोड इस्तेमाल दर्ज नहीं हुआ"); } }
const reviewDiscAmt=gross=>{ const s=S(); return r2(s.revDiscType==="flat"?Math.min(gross,+s.revDiscValue||50):gross*(+s.revDiscValue||5)/100); };
function nextBillNo(){ const s=S(); let max=0; state.bills.filter(b=>!isRet(b)).forEach(b=>{ const m=String(b.no||"").match(/(\d+)\s*$/); if(m) max=Math.max(max,+m[1]); }); return s.prefix+String(max+1).padStart(4,"0"); }

function billText(b0){
  const s=S(); const L=[]; const ret=isRet(b0); const b=absView(b0);
  if(ret) L.push("*CREDIT NOTE / वापसी पर्ची*"); else if(b.gstOn) L.push("*TAX INVOICE / टैक्स इनवॉइस*");
  L.push("*"+s.name+"*"); L.push("शुद्ध · प्राकृतिक · बिना रिफाइन · कोल्ड प्रेस"); if(s.address) L.push(s.address); if(s.phone) L.push("फ़ोन: "+s.phone); if(b.gstOn&&s.gstin) L.push("GSTIN: "+s.gstin);
  L.push(""); L.push((ret?"क्रेडिट नोट नं: ":"बिल नं: ")+b.no+"   तारीख: "+showDate(b.date)); if(ret) L.push("असली बिल: "+(b.againstNo||"")); L.push("ग्राहक: "+(b.customerName||"नकद ग्राहक")); if(b.gstOn&&b.customerGstin) L.push("ग्राहक GSTIN: "+b.customerGstin);
  L.push("------------------------------");
  (b.items||[]).forEach(it=>L.push(it.name+(b.gstOn&&it.hsn?" (HSN "+it.hsn+", GST "+it.gst+"%)":"")+"  "+fmtQty(it)+(it.unit==="kg"||it.unit==="ग्राम"?" (≈"+(Math.round(toLitres(it)*1000)/1000)+" लीटर)":"")+" × "+inr(it.rate)+(isOilUnit(it.unit)?"/लीटर":"")+" = "+inr(lineAmt(it))));
  L.push("------------------------------");
  if(b.discount) L.push("छूट: -"+inr(b.discount));
  if(b.gstOn&&b.tax){ const cg=r2(b.tax/2); L.push("टैक्स योग्य राशि: "+inr(b.sub)); L.push("CGST: "+inr(cg)+"  SGST: "+inr(r2(b.tax-cg))); if(s.gstIncl) L.push("(रेट में GST शामिल है)"); }
  if(ret){ L.push("*वापसी राशि: "+inr(b.total)+"*"); L.push(b.refundHow||""); }
  else { L.push("*कुल राशि: "+inr(b.total)+"*");
  L.push("जमा: "+inr(b.paid||0)+" ("+(b.mode||"नकद")+")");
  const due=billDue(b); if(due>0) L.push("*बाकी: "+inr(due)+"*"); }
  if(!ret&&b.reviewCode) L.push("⭐ रिव्यू छूट"+(b.reviewCashback>0?" (कैशबैक "+inr(b.reviewCashback)+" दिया)":"")+" · कोड "+b.reviewCode);
  L.push(""); L.push(s.footer);
  L.push(""); L.push("👉 हमसे जुड़ें (Instagram, Facebook, WhatsApp ग्रुप):"); L.push(LINKS_URL);
  return L.join("\n");
}

// ---------- Saving and sharing files ----------
const MAX_DOC=700*1024; // Firestore doc limit is 1 MB; keep files well under it (free plan has no file storage)
function loadScript(src){ return new Promise((r,j)=>{ const t=document.createElement("script"); t.src=src; t.onload=r; t.onerror=j; document.head.appendChild(t); }); }
async function ensurePdfJs(){
  if(window.pdfjsLib) return;
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}
function blobToDataUrl(blob){ return new Promise((r,j)=>{ const fr=new FileReader(); fr.onload=()=>r(String(fr.result)); fr.onerror=j; fr.readAsDataURL(blob); }); }
async function dataUrlToBlob(u){ return (await fetch(u)).blob(); }
async function shrinkImage(src,maxBytes){ // src: Blob or canvas
  let c=src;
  if(!(src instanceof HTMLCanvasElement)){ const bmp=await createImageBitmap(src); c=document.createElement("canvas"); const k=Math.min(1,1600/Math.max(bmp.width,bmp.height)); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); }
  for(let q=0.75, scale=1; ; ){
    let cc=c; if(scale<1){ cc=document.createElement("canvas"); cc.width=Math.round(c.width*scale); cc.height=Math.round(c.height*scale); cc.getContext("2d").drawImage(c,0,0,cc.width,cc.height); }
    const b=await new Promise(r=>cc.toBlob(r,"image/jpeg",q));
    if(b.size<=maxBytes||scale<0.3) return b;
    if(q>0.5) q-=0.1; else scale*=0.8;
  }
}
// Turns a photo or PDF into something that fits in one Firestore document.
async function packBillFile(file){
  if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){
    if(file.size<=MAX_DOC) return {name:file.name,type:"application/pdf",data:await blobToDataUrl(file)};
    await ensurePdfJs();
    const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; const n=Math.min(3,pdf.numPages); const pages=[];
    for(let i=1;i<=n;i++){ const page=await pdf.getPage(i); const vp=page.getViewport({scale:1.5}); const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
      await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise; pages.push(await blobToDataUrl(await shrinkImage(c,Math.floor(MAX_DOC/n*0.72)))); }
    return {name:file.name.replace(/\.pdf$/i,"")+".jpg",type:"image/jpeg",pages,note:pdf.numPages>3?"पहले 3 पेज":""};
  }
  if(file.type.startsWith("image/")) return {name:(file.name||"bill").replace(/\.[^.]+$/,"")+".jpg",type:"image/jpeg",data:await blobToDataUrl(await shrinkImage(file,MAX_DOC*0.72))};
  throw new Error("type");
}
async function openBillFile(fileId,fileName){
  toast("फ़ाइल खुल रही है…");
  const f=await FBX.get("purchaseFiles/"+fileId); if(!f){ toast("फ़ाइल नहीं मिली"); return; }

}
async function shareFiles(files,text){ // files: File[]
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
    const uris=[]; for(const f of files){ const w=await C.Plugins.Filesystem.writeFile({path:f.name.replace(/[^\w.-]+/g,"_"),data:await blobToB64(f),directory:"CACHE"}); uris.push(w.uri); }
    try{ await C.Plugins.Share.share({text,files:uris,dialogTitle:"व्हाट्सएप चुनें"}); }catch(_){ }
    return "shared";
  }
  if(navigator.canShare&&navigator.canShare({files})){ try{ await navigator.share({files,text}); return "shared"; }catch(e){ return e&&e.name==="AbortError"?"cancel":"fail"; } }
  return "unsupported";
}
function blobToB64(blob){ return new Promise((r,j)=>{ const fr=new FileReader(); fr.onload=()=>r(String(fr.result).split(",")[1]); fr.onerror=j; fr.readAsDataURL(blob); }); }
async function saveFile(name,blob,{share=false,text=""}={}){
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
    const w=await C.Plugins.Filesystem.writeFile({path:name,data:await blobToB64(blob),directory:"CACHE"});
    try{ await C.Plugins.Share.share({title:name,text,files:[w.uri],dialogTitle:"भेजें"}); }catch(_){ }
    return "shared";
  }
  if(share){ const file=new File([blob],name,{type:blob.type||"application/octet-stream"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:name,text}); return "shared"; }catch(e){ if(e&&e.name==="AbortError") return "cancel"; } } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },5000);
  return "downloaded";
}

async function downloadPdf(b,btn){
  if(!window.html2canvas||!window.jspdf){ toast("PDF बनाने वाला हिस्सा लोड नहीं हुआ, पेज दोबारा खोलें"); return; }
  const old=btn.textContent; btn.disabled=true; btn.textContent="PDF बन रहा है…";
  const host=document.createElement("div"); host.style.cssText="position:fixed;left:-10000px;top:0;z-index:-1"; host.innerHTML=invoiceHtml(b); document.body.appendChild(host);
  try{
    try{ await document.fonts.ready; }catch(_){}
    await Promise.all([...host.querySelectorAll("img")].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
    const canvas=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
    const pw=210, ph=297, ih=canvas.height*pw/canvas.width; const img=canvas.toDataURL("image/jpeg",0.92);
    let y=0; pdf.addImage(img,"JPEG",0,0,pw,ih); while(ih+y>ph+1){ y-=ph; pdf.addPage(); pdf.addImage(img,"JPEG",0,y,pw,ih); }
    const blob=pdf.output("blob"); const fname=(b.no+"_"+(b.customerName||"bill")).replace(/[^\w\u0900-\u097F-]+/g,"_")+".pdf";
    host.remove(); btn.disabled=false; btn.textContent="📤 PDF भेजें (WhatsApp)";
    btn.onclick=async()=>{ const r=await saveFile(fname,blob,{share:true,text:"आपका बिल "+b.no+" · "+inr(b.total)+" · "+S().name+"\n👉 हमसे जुड़ें: "+LINKS_URL}); if(r==="downloaded") toast("PDF डाउनलोड हो गया, अब WhatsApp में 📎 से भेजें"); };
    toast("PDF तैयार है, अब “PDF भेजें” दबाएं");
  }catch(e){ host.remove(); btn.disabled=false; btn.textContent=old; toast("PDF नहीं बन पाया"); }
}

async function fileToImages(file){
  if(file.type.startsWith("image/")) return [file];
  if(!window.pdfjsLib) throw new Error("pdf");
  const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; const out=[];
  for(let i=1;i<=Math.min(3,pdf.numPages);i++){
    const page=await pdf.getPage(i); const vp=page.getViewport({scale:1.6}); const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
    await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.85)));
  }
  return out;
}

    const btn=$("#nu_add"); btn.disabled=true; btn.textContent="जोड़ रहे हैं…";
    try{ const nuid=await FBX.createUserOther(phoneEmail(ph),pin); await FBX.set("users/"+nuid,{name,phone:ph,role,createdAt:Date.now()}); toast(name+" जोड़ दिया गया"); }
    catch(x){ toast(x&&x.code==="auth/email-already-in-use"?"यह नंबर पहले से है। उसका पुराना PIN डालें या दूसरा नंबर लें":"नहीं जुड़ा: "+(x&&x.code||x)); btn.disabled=false; btn.textContent="+ जोड़ें"; } };
  v.querySelectorAll("[data-rmuser]").forEach(b=>b.onclick=async()=>{ const id=b.dataset.rmuser; if(confirmStaffDel!==id){ confirmStaffDel=id; render(); return; } confirmStaffDel=null;
    try{ await FBX.del("users/"+id); toast("हटा दिया, अब वो लॉगिन नहीं कर पाएंगे"); }catch(_){ toast("हटाया नहीं जा सका"); } });
}
// ---------- Sticker QR codes and scanner ----------
// One QR per oil: "DEO|<productId>". After a scan the staff picks the quantity.
const UNCODE={L:"लीटर",ml:"ml",kg:"kg",g:"ग्राम"};
const qrPayload=pid=>"DEO|"+pid;
function parseQr(t){ const m=String(t||"").trim().split("|"); if(m[0]!=="DEO"||!m[1]) return null; return {pid:m[1],qty:m[2]?+m[2]:0,unit:m[3]?(UNCODE[m[3]]||m[3]):""}; }
async function ensureLib(globalName,url){ if(!window[globalName]) await loadScript(url); return window[globalName]; }
const QRGEN_URL="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js", JSQR_URL="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
async function qrDataUrl(text){ const qrcode=await ensureLib("qrcode",QRGEN_URL); const q=qrcode(0,"M"); q.addData(text); q.make(); return q.createDataURL(8,2); }
let stickSel={prods:new Set(), copies:6};
function openStickers(){
  const ps=state.products.filter(p=>(p.unit||"लीटर")==="लीटर").sort((a,b)=>a.name.localeCompare(b.name));
  if(!stickSel.prods.size) ps.forEach(p=>stickSel.prods.add(p.id));
  const root=$("#modalRoot");
  root.innerHTML=`<div class="modal" id="mbg"><div class="card" role="dialog" aria-label="स्टिकर QR">
    <div class="row" style="align-items:center"><h3>🏷️ स्टिकर के लिए QR</h3><button class="btn ghost small" id="skx" style="flex:none">बंद करें</button></div>
    <p class="muted" style="margin:0;font-size:.9rem">हर तेल का एक QR बनेगा, उस पर सिर्फ़ लोगो और तेल का नाम होगा। बिल बनाते समय “📷 स्टिकर स्कैन करें” दबाकर QR दिखाएँ, तेल अपने-आप आ जाएगा। फिर मात्रा (ml, लीटर या kg) चुनें, दाम अपने-आप लग जाएगा।</p>
    <b>कौन से तेल</b>
    <div class="segs">${ps.map(p=>`<label class="check chip"><input type="checkbox" data-sp="${esc(p.id)}" ${stickSel.prods.has(p.id)?"checked":""}> ${esc(p.name)}</label>`).join("")}</div>
    <label>हर तेल के कितने स्टिकर<input type="number" id="skCopies" min="1" max="96" value="${stickSel.copies}"></label>
    <button class="btn primary" id="skGo">स्टिकर PDF बनाएं</button>
    <p class="muted" style="margin:0;font-size:.85rem">A4 पेज पर 24 स्टिकर (3×8) आते हैं। किसी भी प्रिंट वाले से A4 स्टिकर शीट पर छपवा लें। दाम बदलने पर भी स्टिकर वही चलेंगे।</p>
  </div></div>`;
  $("#skx").onclick=()=>{ root.innerHTML=""; };
  root.querySelectorAll("[data-sp]").forEach(c=>c.onchange=()=>c.checked?stickSel.prods.add(c.dataset.sp):stickSel.prods.delete(c.dataset.sp));
  $("#skGo").onclick=async()=>{ const btn=$("#skGo"); stickSel.copies=Math.max(1,Math.min(96,+$("#skCopies").value||1));
    const chosen=ps.filter(p=>stickSel.prods.has(p.id)); if(!chosen.length){ toast("तेल चुनें"); return; }
    btn.disabled=true; btn.textContent="बन रहा है…";
    try{ await makeStickerPdf(chosen,stickSel.copies); }catch(e){ toast("PDF नहीं बना, इंटरनेट देखें"); }
    btn.disabled=false; btn.textContent="स्टिकर PDF बनाएं"; };
}
async function makeStickerPdf(prods,copies){
  const labels=[]; for(const p of prods){ const img=await qrDataUrl(qrPayload(p.id)); for(let c=0;c<copies;c++) labels.push({p,img}); }
  const per=24, pages=[]; for(let i=0;i<labels.length;i+=per) pages.push(labels.slice(i,i+per));
  const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
  for(let pi=0;pi<pages.length;pi++){
    const host=document.createElement("div"); host.style.cssText="position:fixed;left:-10000px;top:0";
    host.innerHTML=`<div style="width:794px;height:1123px;background:#fff;padding:30px 20px;box-sizing:border-box;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:132px;font-family:Mukta,'Noto Sans Devanagari',Arial,sans-serif">
      ${pages[pi].map(l=>`<div style="border:1px dashed #bbb;display:flex;align-items:center;gap:8px;padding:6px 8px;box-sizing:border-box;overflow:hidden">
        <img src="${l.img}" style="width:112px;height:112px;flex:none;image-rendering:pixelated">
        <div style="line-height:1.2;min-width:0"><img src="${LOGO_URL}" style="height:30px;width:auto;display:block;margin-bottom:6px">
          <div style="font-weight:800;font-size:17px;color:#0b3d10">${esc(l.p.name)}</div></div></div>`).join("")}</div>`;
    document.body.appendChild(host);
    await Promise.all([...host.querySelectorAll("img")].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
    try{ await document.fonts.ready; }catch(_){}
    const canvas=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:"#ffffff",logging:false}); host.remove();
    if(pi) pdf.addPage(); pdf.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297);
  }
  await saveFile("Divine_stickers.pdf",pdf.output("blob"),{share:true,text:"Divine Elite Oil स्टिकर"});
}
const PICK_SIZES=[[100,"ml"],[200,"ml"],[250,"ml"],[500,"ml"],[1,"लीटर"],[2,"लीटर"],[5,"लीटर"],[10,"लीटर"],[15,"लीटर"],[50,"लीटर"],[1,"kg"],[2,"kg"],[5,"kg"],[15,"kg"]];
function addScanned(p,qty,unit){
  const ex=draft.items.find(it=>it.pid===p.id&&it.unit===unit&&+it.rate===+p.rate);
  if(ex) ex.qty=r2((+ex.qty||0)+qty);
  else { const blank=draft.items.findIndex(it=>!String(it.name).trim()); const it={name:p.name,pid:p.id,qty,unit,rate:+p.rate||0,kgPerL:prodKgpl(p),gst:p.gst!=null?+p.gst:5,hsn:p.hsn||""}; if(blank>=0) draft.items[blank]=it; else draft.items.push(it); }
}
async function makeReviewPoster(){
  const img=await qrDataUrl(REVIEW_URL);
  const host=document.createElement("div"); host.style.cssText="position:fixed;left:-10000px;top:0";
  host.innerHTML=`<div style="width:794px;height:1123px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;font-family:Mukta,'Noto Sans Devanagari',Arial,sans-serif;text-align:center;border:14px solid #1d5e2c;box-sizing:border-box">
    <img src="${LOGO_URL}" style="width:520px;height:auto">
    <div style="font-size:52px;font-weight:800;color:#0b3d10;line-height:1.1">हमारा तेल कैसा लगा?</div>
    <div style="font-size:64px;color:#e3a917;letter-spacing:8px">★★★★★</div>
    <img src="${img}" style="width:400px;height:400px;image-rendering:pixelated">

    <div style="font-size:40px;font-weight:800;color:#fff;background:#b3261e;border-radius:16px;padding:10px 28px">इसी बिल पर ${esc(reviewDiscText())} 🎁</div></div>`;
  document.body.appendChild(host);

  const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true}); pdf.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297);
  await saveFile("Divine_review_QR.pdf",pdf.output("blob"),{share:true,text:"Divine Elite Oil रिव्यू QR"});
}
let scanStop=null;
async function openScanner(){
  const root=$("#modalRoot"); let added=[]; let pending=null;
  root.innerHTML=`<div class="modal" id="mbg"><div class="card" role="dialog" aria-label="स्कैन">
    <div class="row" style="align-items:center"><h3>📷 स्टिकर स्कैन करें</h3><button class="btn primary small" id="scx" style="flex:none">हो गया</button></div>
    <div id="scCam" style="position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3"><video id="scv" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
      <div style="position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:12px"></div></div>
    <div id="scPick" hidden></div>
    <div id="scmsg" class="notice">QR को डिब्बे के अंदर रखें…</div>
    <div class="list" id="sclist"></div></div></div>`;
  const msg=t=>{ const m=$("#scmsg"); if(m) m.textContent=t; };
  let stream=null, raf=0, last="", lastAt=0, stopped=false;
  const stop=()=>{ stopped=true; cancelAnimationFrame(raf); if(stream) stream.getTracks().forEach(t=>t.stop()); scanStop=null; };
  scanStop=stop;
  $("#scx").onclick=()=>{ stop(); root.innerHTML=""; render(); };
  const showList=()=>{ const l=$("#sclist"); if(l) l.innerHTML=added.slice(0,8).map(t=>`<div class="li"><span class="main">✓ ${esc(t)}</span></div>`).join(""); };
  const ask=p=>{ pending=p; $("#scCam").hidden=true; const box=$("#scPick"); box.hidden=false;
    box.innerHTML=`<div class="notice" style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:1.15rem"><b>${esc(p.name)}</b> <span class="muted">· ${inr(p.rate)}/लीटर</span></div>
      <b>कितना देना है?</b>
      <div class="qchips">${PICK_SIZES.map(([q,u])=>`<button type="button" class="chip" style="font-size:1rem;padding:8px 12px" data-pq="${q}" data-pu="${u}">${q} ${u}</button>`).join("")}</div>
      <div class="row" style="align-items:end"><label>या खुद लिखें<input type="number" step="any" min="0" inputmode="decimal" id="pkQ" placeholder="जैसे 3"></label>
        <label>यूनिट<select id="pkU">${OIL_UNITS.map(u=>`<option>${u}</option>`).join("")}</select></label>
        <button class="btn primary" type="button" id="pkOk" style="flex:none">जोड़ें</button></div>
      <button class="btn ghost small" type="button" id="pkNo">रद्द करें</button></div>`;
    const done=(q,u)=>{ if(!(q>0)){ toast("मात्रा डालें"); return; } addScanned(p,q,u); try{ navigator.vibrate&&navigator.vibrate(80); }catch(_){}
      const it={qty:q,unit:u,rate:+p.rate||0,kgPerL:prodKgpl(p)}; added.unshift(p.name+" · "+q+" "+u+" · "+inr(lineAmt(it))); showList(); back("✓ जुड़ गया। अगला QR दिखाएँ या “हो गया” दबाएँ।"); };
    box.querySelectorAll("[data-pq]").forEach(b=>b.onclick=()=>done(+b.dataset.pq,b.dataset.pu));
    $("#pkOk").onclick=()=>done(+$("#pkQ").value,$("#pkU").value);
    $("#pkNo").onclick=()=>back("QR को डिब्बे के अंदर रखें…");
    msg("मात्रा चुनें"); };
  const back=t=>{ pending=null; const box=$("#scPick"); if(box){ box.hidden=true; box.innerHTML=""; } const cam=$("#scCam"); if(cam) cam.hidden=false; lastAt=Date.now(); msg(t); }; // same sticker must leave the view before it opens again
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}); }
  catch(e){ msg("कैमरा नहीं खुला। फ़ोन की सेटिंग में इस ऐप को कैमरा की इजाज़त दें।"); return; }
  if(stopped){ stream.getTracks().forEach(t=>t.stop()); return; }
  const video=$("#scv"); video.srcObject=stream; try{ await video.play(); }catch(_){}
  let detector=null; try{ if("BarcodeDetector" in window){ const f=await BarcodeDetector.getSupportedFormats(); if(f.includes("qr_code")) detector=new BarcodeDetector({formats:["qr_code"]}); } }catch(_){}
  let jsQR=null; if(!detector){ try{ jsQR=await ensureLib("jsQR",JSQR_URL); }catch(_){ msg("स्कैनर लोड नहीं हुआ, इंटरनेट देखें"); return; } }
  const c=document.createElement("canvas"), ctx=c.getContext("2d",{willReadFrequently:true});
  const onCode=text=>{ if(pending) return; const now=Date.now(); const same=text===last&&now-lastAt<1200; lastAt=now; last=text; if(same) return;
    const d=parseQr(text); if(!d){ msg("यह हमारा स्टिकर QR नहीं है"); return; }
    const p=state.products.find(x=>x.id===d.pid); if(!p){ msg("यह तेल प्रोडक्ट लिस्ट में नहीं मिला"); return; }
    try{ navigator.vibrate&&navigator.vibrate(60); }catch(_){}
    ask(p); };
  const tick=async()=>{ if(stopped) return;
    if(!pending&&video.readyState>=2){
      try{ if(detector){ const r=await detector.detect(video); if(r[0]) onCode(r[0].rawValue); }
        else { const w=640, h=Math.round(video.videoHeight*640/video.videoWidth)||480; c.width=w; c.height=h; ctx.drawImage(video,0,0,w,h); const r=jsQR(ctx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"}); if(r) onCode(r.data); } }catch(_){}
    }
    raf=requestAnimationFrame(tick); };
  tick();
}
function editProduct(id){
  const p=id?state.products.find(x=>x.id===id):{name:"",unit:"लीटर",rate:"",gst:5};
  const root=$("#modalRoot");
  root.innerHTML=`<div class="modal" id="mbg"><form class="card" id="pf">
    <h3>${id?"प्रोडक्ट बदलें":"नया प्रोडक्ट"}</h3>
    <label>नाम<input id="p_name" required value="${esc(p.name)}" placeholder="जैसे: सरसों तेल 15 लीटर टिन"></label>
    <div class="row"><label>यूनिट<select id="p_unit">${["लीटर","किलो","टिन","बोतल","पैकेट","पीस"].map(u=>`<option ${u===p.unit?"selected":""}>${u}</option>`).join("")}</select></label>
    <label>रेट (₹)<input type="number" step="any" min="0" id="p_rate" required value="${esc(p.rate)}"></label>
    <label>GST %<select id="p_gst">${[0,5,12,18].map(g=>`<option ${+g===+p.gst?"selected":""}>${g}</option>`).join("")}</select></label>
    <label>HSN कोड<input id="p_hsn" inputmode="numeric" value="${esc(p.hsn||"")}" placeholder="जैसे: 1514"></label></div>
    <label>1 लीटर का वज़न (kg) <small class="muted">किलो में बेचने पर दाम इसी से निकलेगा</small><input type="number" step="0.001" min="0.5" max="1.5" id="p_kgpl" value="${esc(prodKgpl(id?p:null))}"></label>
    <div class="row"><button class="btn primary" type="submit">सेव करें</button><button class="btn ghost" type="button" id="px">रद्द करें</button>
    ${id?`<button class="btn ghost danger" type="button" id="pdel">${confirmPDel===id?"पक्का हटाएं?":"हटाएं"}</button>`:""}</div>
  </form></div>`;
  const close=()=>{ root.innerHTML=""; confirmPDel=null; };
  $("#px").onclick=close; $("#mbg").onclick=e=>{ if(e.target.id==="mbg") close(); };
  $("#pf").onsubmit=async e=>{ e.preventDefault(); await save("products",id||uid(),{name:$("#p_name").value.trim(),unit:$("#p_unit").value,rate:+$("#p_rate").value||0,gst:+$("#p_gst").value,hsn:$("#p_hsn").value.trim(),kgPerL:+$("#p_kgpl").value||0.91}); close(); toast("प्रोडक्ट सेव हो गया"); };
  if($("#pdel")) $("#pdel").onclick=async()=>{ if(confirmPDel!==id){ confirmPDel=id; editProduct(id); return; } close(); await removeRec("products",id); };
}

render();
connect();
})();
