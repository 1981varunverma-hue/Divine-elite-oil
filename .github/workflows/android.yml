name: Android APK
on:
  push:
    branches: [main]
    paths: ["android-shell/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        working-directory: android-shell
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: App icon
        working-directory: android-shell
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp res/ic_launcher-$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp res/ic_launcher-$d.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            rm -f android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done
      - name: Signing key
        working-directory: android-shell/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.jks
            cat >> app/build.gradle <<GRADLE
          android {
            signingConfigs { release { storeFile file("release.jks"); storePassword System.getenv("KEYSTORE_PASS"); keyAlias "divine"; keyPassword System.getenv("KEYSTORE_PASS") } }
            buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE
            echo "SIGNED=1" >> $GITHUB_ENV
          fi
      - name: Build APK
        working-directory: android-shell/android
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then ./gradlew assembleRelease --no-daemon; cp app/build/outputs/apk/release/app-release.apk ../../DivineBilling.apk;
          else ./gradlew assembleDebug --no-daemon; cp app/build/outputs/apk/debug/app-debug.apk ../../DivineBilling.apk; fi
      - uses: actions/upload-artifact@v4
        with:
          name: DivineBilling-apk
          path: DivineBilling.apk
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Divine Billing Android app
          body: "Latest Android app. Download DivineBilling.apk on the phone and install it."
          files: DivineBilling.apk
          make_latest: true
